<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Lead-gen sourcing pipeline data flow</title>
      <desc id="flow-desc">External APIs source and match companies and contacts, the skill's own logic filters, dedupes, and scores them, and the CRM check keeps enrichment spend to net-new contacts, before a final enrichment call back out to Apollo.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="840" height="356" fill="#f5f5f5"/>
      <rect width="840" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="840" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="164" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">SOURCE</text>
        <rect x="276" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">FILTER</text>
        <rect x="388" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">MATCH</text>
        <rect x="500" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">DEDUPE</text>
        <rect x="612" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="644" y="14" class="step-number focal-text">05</text><text x="644" y="29" class="step-label focal-text">SCORE</text>
        <rect x="724" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">ENRICH</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">EXTERNAL</text><text x="70" y="84" class="lane-label">APIS</text>
        <text x="70" y="152" class="lane-label">LEADGEN</text><text x="70" y="164" class="lane-label">SKILL</text>
        <text x="70" y="232" class="lane-label">CRM</text><text x="70" y="244" class="lane-label">CHECK</text>
      </g>

      <!-- Connectors first (z-order: behind node rects). Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M358 156 H412 Q420 156 420 148 V108" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M470 76 H524 Q532 76 532 84 V204" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M582 236 H636 Q644 236 644 228 V188" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <rect x="585" y="216" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="611" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUALIFIED</text>
      <path d="M694 156 H748 Q756 156 756 148 V108" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>

      <!-- External APIs: Source Companies -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">API</text>
      <text x="196" y="67" class="node-title">Source Companies</text><text x="196" y="79" class="node-sub">vertical → company list</text><text x="196" y="91" class="node-tool">Maps/Apify · Apollo co.</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="234" y="104" class="chip-text">LS</text>

      <!-- Leadgen Skill: Filter & Categorize -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="133" class="role-text">SKL</text>
      <text x="308" y="147" class="node-title">Filter &amp; Categorize</text><text x="308" y="159" class="node-sub">drop noise · tag by fit</text><text x="308" y="171" class="node-tool">skill logic</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="270" y="184" class="chip-text">LS</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="346" y="184" class="chip-text">LS</text>

      <!-- External APIs: Match Decision-Makers -->
      <rect x="370" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="383" y="53" class="role-text">API</text>
      <text x="420" y="67" class="node-title">Match Decision-Makers</text><text x="420" y="79" class="node-sub">people search by domain</text><text x="420" y="91" class="node-tool">Apollo.io</text>
      <rect x="374" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="382" y="104" class="chip-text">LS</text>
      <rect x="450" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="458" y="104" class="chip-text">DB</text>

      <!-- CRM Check: Dedupe vs CRM -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="213" class="role-text">CRM</text>
      <text x="532" y="227" class="node-title">Dedupe vs CRM</text><text x="532" y="239" class="node-sub">skip existing contacts</text><text x="532" y="251" class="node-tool">CRM lookup</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="494" y="264" class="chip-text">DB</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="570" y="264" class="chip-text">DB</text>

      <!-- Leadgen Skill: Score (focal) -->
      <rect x="594" y="124" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="607" y="133" class="role-text focal-text">SKL</text>
      <text x="644" y="147" class="node-title">Score (ICP fit)</text><text x="644" y="159" class="node-sub">power · fit · geo · signal</text><text x="644" y="171" class="node-tool">skill logic</text>
      <rect x="598" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="606" y="184" class="chip-text">DB</text>
      <rect x="674" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="682" y="184" class="chip-text">TB</text>

      <!-- External APIs: Enrich, Deliberately -->
      <rect x="706" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="710" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="719" y="53" class="role-text">API</text>
      <text x="756" y="67" class="node-title">Enrich, Deliberately</text><text x="756" y="79" class="node-sub">cost confirmed → reveal</text><text x="756" y="91" class="node-tool">Apollo.io enrich</text>
      <rect x="710" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="718" y="104" class="chip-text">TB</text>
      <rect x="786" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="794" y="104" class="chip-text">TB</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Source</text>
      <rect x="286" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="298" y="292" class="step-number">02</text><text x="318" y="293" class="legend-text">Filter</text>
      <rect x="382" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="394" y="292" class="step-number">03</text><text x="414" y="293" class="legend-text">Match</text>
      <rect x="478" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="490" y="292" class="step-number">04</text><text x="510" y="293" class="legend-text">Dedupe</text>
      <rect x="590" y="284" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/><text x="602" y="292" class="step-number focal-text">05</text><text x="622" y="293" class="legend-text">Score</text>
      <rect x="700" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="712" y="292" class="step-number">06</text><text x="732" y="293" class="legend-text">Enrich</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="188" y="312" class="chip-text">LS</text><text x="202" y="314" class="legend-text">List</text>
      <rect x="248" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="256" y="312" class="chip-text">DB</text><text x="270" y="314" class="legend-text">Dataset</text>
      <rect x="330" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="338" y="312" class="chip-text">TB</text><text x="352" y="314" class="legend-text">Scored table</text>
      <text x="440" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5d75" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Standard handoff</text>
      <line x1="336" y1="333" x2="360" y2="333" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="368" y="336" class="legend-text">Focal handoff</text>
      <line x1="496" y1="333" x2="520" y2="333" stroke="#2e5aa8" marker-end="url(#arr-link)"/><text x="528" y="336" class="legend-text">Deliberate external call</text>
    </svg>
